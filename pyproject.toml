[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-manager"
version = "0.1.0"
description = "AI-Powered Personal Assistant"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "pyyaml",
    "loguru",
    "jinja2",
    "aiosqlite",
    "python-multipart",
    "gitpython",
    "watchdog",
    "typer[all]",
    "rich",
]

[project.scripts]
pm = "app.cli:app"
personal-manager = "app.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
